name: Build

on:
  push:
    # The fork's work branches too: macOS changes are written on Windows and
    # this is where they get compiled.
    branches: [main, 'mochi-*', 'security-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build checks only read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test multi-screen gaze geometry
        run: bash scripts/test-gaze-geometry.sh

      - name: Test idle micro animations
        run: bash scripts/test-idle-animation.sh

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The sandboxed target compiles the #if APPSTORE paths the one above skips.
      - name: Build App Store target
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouAppStore \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
