name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build checks only read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test multi-screen gaze geometry
        run: bash scripts/test-gaze-geometry.sh

      - name: Test idle micro animations
        run: bash scripts/test-idle-animation.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
