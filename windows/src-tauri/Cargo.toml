[package]
name = "coucou"
description = "Coucou for Windows — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
# Desktop only: the staticlib/cdylib kinds from the Tauri template exist for
# mobile targets, and a cdylib exporting every symbol overflows the GNU
# linker's ordinal table ("export ordinal too large") on x86_64-pc-windows-gnu.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already in the tree through tauri and reqwest; used to validate URLs before
# they reach the shell or carry an API key.
url = "2"
# LAN Mochis (lan/): Ed25519, X25519, HKDF, AES-GCM. Already in the tree
# through rustls; named here to use it directly.
ring = "0.17"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  # Now playing (media.rs): the System Media Transport Controls.
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
